services:
    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: lareact12_app
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        environment:
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
        networks:
            - lareact
    
    queue:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: lareact12_queue
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        environment:
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
        networks:
            - lareact
        command: php artisan queue:work redis --queue=notifications,default --sleep=3 --tries=3 --max-time=3600
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "ps aux | grep -q '[q]ueue:work' || exit 1"]
            retries: 3
            timeout: 5s
            interval: 30s
    
    scheduler:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: lareact12_scheduler
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        environment:
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
        networks:
            - lareact
        command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "ps aux | grep -q '[p]hp' || exit 1"]
            retries: 3
            timeout: 5s
            interval: 60s
    
    web:
        image: 'nginx:alpine'
        container_name: lareact12_web
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - '.:/var/www/html'
            - './docker/nginx/conf.d:/etc/nginx/conf.d'
            - './docker/nginx/nginx.conf:/etc/nginx/nginx.conf'
        networks:
            - lareact
        depends_on:
            - app

    reverb:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: lareact12_reverb
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        environment:
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - REVERB_APP_ID=${REVERB_APP_ID}
            - REVERB_APP_KEY=${REVERB_APP_KEY}
            - REVERB_APP_SECRET=${REVERB_APP_SECRET}
            - REVERB_HOST=${REVERB_HOST:-localhost}
            - REVERB_PORT=${REVERB_PORT:-8080}
            - REVERB_SCHEME=${REVERB_SCHEME:-http}
        ports:
            - '${REVERB_PORT:-8080}:8080'
        networks:
            - lareact
        command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "ps aux | grep -q '[r]everb:start' || exit 1"]
            retries: 3
            timeout: 5s
            interval: 30s

networks:
    lareact:
      driver: bridge