services:
  # Nginx Reverse Proxy
  nginx:
    image: 'nginx:alpine'
    container_name: lareact12-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/var/www/public:ro
    depends_on:
      - app
    networks:
      - lareact12

  # PHP Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lareact12-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/prod.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=lareact12
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - BROADCAST_DRIVER=pusher
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET}
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      soketi:
        condition: service_healthy
    networks:
      - lareact12
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lareact12-queue
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/prod.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=lareact12
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - app
    networks:
      - lareact12
    command: php artisan queue:work --sleep=3 --tries=3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lareact12-scheduler
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/prod.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=lareact12
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - app
    networks:
      - lareact12
    command: php artisan schedule:work
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL Database
  postgres:
    image: 'postgres:16-alpine'
    container_name: lareact12-postgres
    restart: always
    environment:
      POSTGRES_DB: lareact12
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/backup:/backup
    ports:
      - '5432:5432'
    networks:
      - lareact12
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Redis Cache & Queue
  redis:
    image: 'redis:7-alpine'
    container_name: lareact12-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - lareact12
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # MinIO Object Storage
  minio:
    image: 'minio/minio:latest'
    container_name: lareact12-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/minio_data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - lareact12
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    command: minio server /minio_data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Soketi WebSocket Server
  soketi:
    image: 'quay.io/soketi/soketi:latest'
    container_name: lareact12-soketi
    restart: always
    environment:
      SOKETI_DEBUG: '0'
      SOKETI_METRICS_SERVER_PORT: '9601'
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
      SOKETI_DEFAULT_APP_MAX_CONNECTIONS: '10000'
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: 'true'
      SOKETI_DEFAULT_APP_ENABLE_STATISTICS: 'true'
    ports:
      - '6001:6001'
      - '9601:9601'
    networks:
      - lareact12
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9601/health']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  lareact12:
    driver: bridge
